server:
  port: 8080

spring:
  application:
    name: RDCM
#  mvc:
#    convert-empty-strings-to-null: true
  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/rdcm?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  
#  # SQL Initialization
#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:schema-v4.sql, classpath:data.sql
#      continue-on-error: false

# MyBatis-Plus Configuration
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.vayen.rdcm.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# Sa-Token Configuration
sa-token:
  token-name: Authorization
  timeout: 2592000
  activity-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-read-cookie: true
  is-read-header: true
  token-prefix: Bearer

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    login-limit:
      enabled: ${APP_SECURITY_LOGIN_LIMIT_ENABLED:true}
      max-failures: ${APP_SECURITY_LOGIN_LIMIT_MAX_FAILURES:8}
      window-seconds: ${APP_SECURITY_LOGIN_LIMIT_WINDOW_SECONDS:300}
      lock-seconds: ${APP_SECURITY_LOGIN_LIMIT_LOCK_SECONDS:900}
  upload:
    base-dir: ${APP_UPLOAD_BASE_DIR:./uploads}
  audit-template:
    company-wage-path: ${APP_AUDIT_COMPANY_WAGE_PATH:docs/附件二、研发工资明细表.xls}
    project-ledger-path: ${APP_AUDIT_PROJECT_LEDGER_PATH:docs/2.研发支出”辅助账RD01明细.xls}

# 日志配置
logging:
  level:
    root: INFO
    com.vayen.rdcm: INFO
    org.mybatis: WARN
    com.baomidou: WARN
