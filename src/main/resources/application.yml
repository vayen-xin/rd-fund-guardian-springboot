server:
  port: 8080

spring:
  application:
    name: RDCM
  
  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/rdcm?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  
#  # SQL Initialization
#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:schema-v4.sql, classpath:data.sql
#      continue-on-error: false

# MyBatis-Plus Configuration
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.vayen.rdcm.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Sa-Token Configuration
sa-token:
  token-name: Authorization
  timeout: 2592000
  activity-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true
  is-read-cookie: true
  is-read-header: true
  token-prefix: Bearer

# 日志配置
logging:
  level:
    root: INFO
    com.vayen.rdcm: DEBUG
    org.mybatis: DEBUG
