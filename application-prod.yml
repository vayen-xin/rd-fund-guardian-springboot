server:
  port: 8080

spring:
  application:
    name: RDCM
  
  # MySQL Database (Docker compose service name: mysql)
  datasource:
    url: jdbc:mysql://mysql:3306/rdcm?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:Rdcm@2026!Strong}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # SQL initialization (skip in prod, schema already loaded)
  sql:
    init:
      mode: never

# MyBatis-Plus Configuration
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.vayen.rdcm.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: com.baomidou.mybatisplus.extension.handlers.MybatisEnumTypeHandler

# Sa-Token Configuration
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（单位：秒） -1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率
  activity-timeout: -1
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # 是否共用一个 token
  is-share: false
  # token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # 是否从header中读取token
  is-read-header: true
  # token 前缀
  token-prefix: Bearer

# 日志配置
logging:
  level:
    root: INFO
    com.vayen.rdcm: DEBUG
    org.mybatis: DEBUG
  file:
    name: /app/logs/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

# 文件上传
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 100MB
