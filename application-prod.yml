server:
  port: 8080

spring:
  application:
    name: RDCM
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/rdcm?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.vayen.rdcm.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

sa-token:
  token-name: Authorization
  timeout: 2592000
  activity-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-read-cookie: true
  is-read-header: true
  token-prefix: Bearer

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://118.25.107.223,https://118.25.107.223}
  security:
    login-limit:
      enabled: ${APP_SECURITY_LOGIN_LIMIT_ENABLED:true}
      max-failures: ${APP_SECURITY_LOGIN_LIMIT_MAX_FAILURES:8}
      window-seconds: ${APP_SECURITY_LOGIN_LIMIT_WINDOW_SECONDS:300}
      lock-seconds: ${APP_SECURITY_LOGIN_LIMIT_LOCK_SECONDS:900}
  upload:
    base-dir: ${APP_UPLOAD_BASE_DIR:/data/rdcm/uploads}
  audit-template:
    company-wage-path: ${APP_AUDIT_COMPANY_WAGE_PATH:/data/rdcm/templates/附件二、研发工资明细表.xls}
    project-ledger-path: ${APP_AUDIT_PROJECT_LEDGER_PATH:/data/rdcm/templates/2.研发支出”辅助账RD01明细.xls}

logging:
  level:
    root: INFO
    com.vayen.rdcm: INFO
    org.mybatis: WARN
    com.baomidou: WARN
  file:
    name: /app/logs/backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
